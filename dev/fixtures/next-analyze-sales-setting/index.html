<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>RAU Next Classic sales setting fixture</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f3f5f7; color: #263a4d; font-family: "Segoe UI", "Yu Gothic UI", Meiryo, sans-serif; }
        header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; min-height: 52px; padding: 8px 18px; background: #2478b5; color: #fff; }
        header strong { margin-right: auto; }
        header button { min-height: 38px; border: 1px solid rgba(255,255,255,.72); border-radius: 6px; background: transparent; color: #fff; font: inherit; }
        main { padding: 20px 24px 60px; }
        [data-mock-tabs] { display: flex; gap: 2px; margin-bottom: 16px; }
        [data-mock-tabs] button { min-height: 42px; padding: 8px 18px; border: 1px solid #c5d0d9; background: #fff; color: inherit; font: inherit; }
        [data-mock-sales-content] { min-width: 0; padding: 18px; border: 1px solid #d2dce4; border-radius: 8px; background: #fff; }
        [data-mock-native-card-list] { display: flex; flex-direction: column; gap: 12px; }
        [data-mock-native-card] { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border: 1px solid #dfe7f5; border-radius: 12px; background: #fafcff; }
        [data-testid="suggestions-heading"] { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 12px; }
        [data-testid="suggestions-room-type-name"] { color: #243447; font-size: 16px; font-weight: 700; }
        [data-mock-native-meta] { display: flex; flex-wrap: wrap; gap: 7px 12px; color: #50627a; font-size: 12px; font-weight: 600; }
        [data-testid="suggestions-room-full-number"] { color: #243447; font-size: 14px; font-weight: 700; }
        [data-testid="suggestions-detail-wrapper"] { min-height: 72px; padding: 10px 12px; border: 1px solid #e1e8ef; border-radius: 8px; background: #fff; }
        [data-mock-native-lines] { display: grid; gap: 7px; }
        [data-mock-native-line] { height: 8px; border-radius: 99px; background: #e3eaf1; }
        [data-mock-native-line]:nth-child(2) { width: 76%; }
        [data-mock-away] { padding: 26px; border: 1px solid #d2dce4; border-radius: 8px; background: #fff; }
        [hidden] { display: none !important; }
        @media (max-width: 680px) {
            main { min-width: 0; padding: 14px 16px 40px; }
            [data-mock-tabs] { max-width: 100%; overflow-x: auto; }
            [data-mock-tabs] button { flex: 0 0 auto; }
            [data-mock-sales-content] { width: 100%; padding: 12px; }
            [data-mock-native-card] { padding: 12px; }
        }
    </style>
</head>
<body>
    <header>
        <strong>Revenue Assistant Analyze mock</strong>
        <button type="button">施設A（mock）</button>
        <span>最終データ更新: 2026年8月8日</span>
        <button type="button" data-mock-show>販売設定を表示</button>
        <button type="button" data-mock-hide>他タブへ</button>
        <button type="button" data-mock-detach-sales>販売設定DOMを一時除去</button>
        <button type="button" data-mock-restore-sales>販売設定DOMを復元</button>
        <button type="button" data-mock-stay-next>翌日のAnalyzeへ</button>
        <button type="button" data-mock-route-away>別画面へ</button>
        <button type="button" data-mock-route-back>Analyzeへ戻る</button>
    </header>
    <main>
        <div data-mock-tabs role="tablist" aria-label="Analyze tabs">
            <button type="button" role="tab" data-testid="tab-suggestions" aria-selected="true">販売設定</button>
            <button type="button" role="tab" data-testid="tab-bookingCurve">ブッキングカーブ</button>
            <button type="button" role="tab" data-testid="tab-competitorPrice">競合価格</button>
            <button type="button" role="tab" data-testid="tab-priceTrends">価格推移</button>
        </div>
        <section data-mock-sales-content>
            <div data-mock-native-card-list>
                <article data-mock-native-card>
                    <div data-testid="suggestions-heading">
                        <span data-testid="suggestions-room-type-name">シングル（mock）</span>
                        <span data-mock-native-meta>
                            <span data-testid="suggestions-latest-reflection-at">最終反映 2026/07/20</span>
                            <span data-testid="suggestions-room-full-number">販売室数 8 / 18</span>
                        </span>
                    </div>
                    <div data-testid="suggestions-detail-wrapper">
                        <div data-mock-native-lines aria-label="標準販売設定の詳細">
                            <span data-mock-native-line></span><span data-mock-native-line></span>
                        </div>
                    </div>
                </article>
                <article data-mock-native-card>
                    <div data-testid="suggestions-heading">
                        <span data-testid="suggestions-room-type-name">ツイン（mock）</span>
                        <span data-mock-native-meta>
                            <span data-testid="suggestions-latest-reflection-at">最終反映 2026/07/29</span>
                            <span data-testid="suggestions-room-full-number">販売室数 10 / 24</span>
                        </span>
                    </div>
                    <div data-testid="suggestions-detail-wrapper">
                        <div data-mock-native-lines aria-label="標準販売設定の詳細">
                            <span data-mock-native-line></span><span data-mock-native-line></span>
                        </div>
                    </div>
                </article>
            </div>
        </section>
        <section data-mock-away hidden>別画面の合成表示</section>
    </main>
    <script>
        (() => {
            const content = document.querySelector("[data-mock-sales-content]");
            const away = document.querySelector("[data-mock-away]");
            let detachedContent = null;
            let detachedNextSibling = null;
            document.querySelector("[data-mock-show]").addEventListener("click", () => { content.hidden = false; });
            document.querySelector("[data-mock-hide]").addEventListener("click", () => { content.hidden = true; });
            document.querySelector("[data-mock-detach-sales]").addEventListener("click", () => {
                if (content.isConnected) {
                    detachedContent = content;
                    detachedNextSibling = content.nextSibling;
                    content.remove();
                }
            });
            document.querySelector("[data-mock-restore-sales]").addEventListener("click", () => {
                if (detachedContent !== null && !detachedContent.isConnected) {
                    const main = document.querySelector("main");
                    main.insertBefore(detachedContent, detachedNextSibling);
                }
            });
            document.querySelector("[data-mock-stay-next]").addEventListener("click", () => {
                history.pushState({}, "", "/dev/fixtures/next-analyze-sales-setting/2026-08-13");
                dispatchEvent(new PopStateEvent("popstate"));
            });
            document.querySelector("[data-mock-route-away]").addEventListener("click", () => {
                history.pushState({}, "", "/monthly-progress/2026-08");
                content.hidden = true;
                away.hidden = false;
                dispatchEvent(new PopStateEvent("popstate"));
            });
            document.querySelector("[data-mock-route-back]").addEventListener("click", () => {
                history.pushState({}, "", "/dev/fixtures/next-analyze-sales-setting/");
                away.hidden = true;
                content.hidden = false;
                dispatchEvent(new PopStateEvent("popstate"));
            });
        })();
    </script>
    <script type="module" src="/src/next/dev/analyzeSalesSettingClassicFixtureEntry.ts"></script>
</body>
</html>
